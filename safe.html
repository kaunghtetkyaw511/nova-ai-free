<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5e46df" />
    <title>Repairing Nova AI…</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        background: #f5f5f1;
        color: #171718;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(88%, 420px); text-align: center; }
      .icon {
        display: grid;
        width: 64px;
        height: 64px;
        margin: 0 auto 18px;
        place-items: center;
        border-radius: 18px;
        background: #5e46df;
        color: #fff;
        font-size: 28px;
      }
      h1 { margin: 0; font-size: 1.45rem; }
      p { color: #6f6f76; line-height: 1.6; }
      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        border-radius: 12px;
        background: #5e46df;
        padding: 0 18px;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">✦</div>
      <h1>Repairing Nova AI</h1>
      <p id="status">Clearing the old Safari cache, then opening iPhone-safe mode…</p>
      <a id="continue" href="./?safe=1">Continue to Nova AI</a>
    </main>
    <script>
      (async () => {
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          document.querySelector("#status").textContent = "Repair complete. Opening Nova AI…";
          setTimeout(() => location.replace("./?safe=1"), 500);
        } catch {
          document.querySelector("#status").textContent = "Tap Continue to open Nova AI in safe mode.";
        }
      })();
    </script>
  </body>
</html>
